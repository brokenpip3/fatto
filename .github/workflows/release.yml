name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-rust-nix:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5368709120

      - name: Build Rust Artifacts via Nix
        run: nix build .#taskchampion-android --no-update-lock-file

      - name: Upload Rust Artifacts (nix)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-artifacts-nix
          path: |
            result/jniLibs
            result/uniffi

  build-kotlin-nix:
    needs: build-rust-nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Maximize Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6 # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5368709120

      - name: Download Rust Artifacts (nix)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-artifacts-nix
          path: android/app/src/main

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-${{ runner.os }}-gradle-nix-${{ hashFiles('flake.nix', 'flake.lock', '**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: v2-${{ runner.os }}-gradle-nix-

      - name: Build Beta APK (nix)
        if: endsWith(github.event.release.tag_name, '-beta')
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          nix develop .#fatto-ci-kotlin --no-update-lock-file --command just build-beta-apk
        env:
          FATTO_KEYSTORE_BASE64: ${{ secrets.FATTO_KEYSTORE_BASE64 }}
          FATTO_KEYSTORE_PASSWORD: ${{ secrets.FATTO_KEYSTORE_PASSWORD }}
          FATTO_KEY_ALIAS: ${{ secrets.FATTO_KEY_ALIAS }}

      - name: Build Stable APK (nix)
        if: "!endsWith(github.event.release.tag_name, '-beta')"
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          nix develop .#fatto-ci-kotlin --no-update-lock-file --command just build-release-apk
        env:
          FATTO_KEYSTORE_BASE64: ${{ secrets.FATTO_KEYSTORE_BASE64 }}
          FATTO_KEYSTORE_PASSWORD: ${{ secrets.FATTO_KEYSTORE_PASSWORD }}
          FATTO_KEY_ALIAS: ${{ secrets.FATTO_KEY_ALIAS }}

      - name: Upload APK Artifact (nix)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apks-nix
          path: dist/*.apk

      - name: Attach APK to Release (nix)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rust-fdroid:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system deps
        run: sudo apt-get install -y gcc libc6-dev rustup

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.94.1 \
            --target aarch64-linux-android \
            --target x86_64-linux-android
          rustup default 1.94.1

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            rust/taskchampion-android/target
            ~/.cargo/registry
            ~/.cargo/git
          key: v2-${{ runner.os }}-rust-fdroid-${{ hashFiles('.github/workflows/release.yml', 'rust/taskchampion-android/Cargo.toml', 'rust/taskchampion-android/Cargo.lock') }}
          restore-keys: v2-${{ runner.os }}-rust-fdroid-

      - name: Setup Android NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK r26b
        run: echo "y" | sdkmanager "ndk;26.1.10909125"

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Build Rust Artifacts
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          cd rust/taskchampion-android
          export RUSTFLAGS="--remap-path-prefix $(pwd)=/c --remap-path-prefix $HOME/.cargo=/cargo -C link-arg=-Wl,--build-id=none"
          cargo ndk -t arm64-v8a -t x86_64 -o ../../android/app/src/main/jniLibs build --release
          cargo build --release
          cargo run --bin uniffi-bindgen generate \
            --library target/release/libtaskchampion_android.so \
            --language kotlin --no-format \
            --out-dir ../../android/app/src/main/uniffi

      - name: Upload Rust Artifacts (fdroid)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-artifacts-fdroid
          path: |
            android/app/src/main/jniLibs
            android/app/src/main/uniffi

  build-kotlin-fdroid:
    needs: build-rust-fdroid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install build-tools and platform
        run: |
          echo "y" | sdkmanager "build-tools;36.0.0" "platforms;android-36" "ndk;26.1.10909125"

      - name: Download Rust Artifacts (fdroid)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-artifacts-fdroid
          path: android/app/src/main

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-${{ runner.os }}-gradle-fdroid-${{ hashFiles('.github/workflows/release.yml', '**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: v2-${{ runner.os }}-gradle-fdroid-

      - name: Build Beta APK (fdroid)
        if: endsWith(github.event.release.tag_name, '-beta')
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          if [ -z "${FATTO_KEYSTORE_BASE64:-}" ]; then echo "Error: FATTO_KEYSTORE_BASE64 not set"; exit 1; fi
          echo "${FATTO_KEYSTORE_BASE64}" | base64 -d > android/app/release.jks
          export FATTO_KEYSTORE_PATH=release.jks
          cd android && ./gradlew assembleBeta
          rm -f release.jks
          cd ..
          mkdir -p dist
          VERSION=$(grep 'VERSION_NAME=' android/version.properties | cut -d'=' -f2)
          for apk in android/app/build/outputs/apk/beta/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            new_name=$(echo "$base" | sed -E "s/^app(-)?(.*)-beta(-unsigned)?\.apk$/fatto-v$VERSION\1\2-beta\3.apk/")
            cp "$apk" "dist/$new_name"
          done
        env:
          FATTO_KEYSTORE_BASE64: ${{ secrets.FATTO_KEYSTORE_BASE64 }}
          FATTO_KEYSTORE_PASSWORD: ${{ secrets.FATTO_KEYSTORE_PASSWORD }}
          FATTO_KEY_ALIAS: ${{ secrets.FATTO_KEY_ALIAS }}

      - name: Build Stable APK (fdroid)
        if: "!endsWith(github.event.release.tag_name, '-beta')"
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          if [ -z "${FATTO_KEYSTORE_BASE64:-}" ]; then echo "Error: FATTO_KEYSTORE_BASE64 not set"; exit 1; fi
          echo "${FATTO_KEYSTORE_BASE64}" | base64 -d > android/app/release.jks
          export FATTO_KEYSTORE_PATH=release.jks
          cd android && ./gradlew assembleRelease
          rm -f release.jks
          cd ..
          mkdir -p dist
          VERSION=$(grep 'VERSION_NAME=' android/version.properties | cut -d'=' -f2)
          for apk in android/app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            new_name=$(echo "$base" | sed -E "s/^app(-)?(.*)-release(-unsigned)?\.apk$/fatto-v$VERSION\1\2\3.apk/")
            cp "$apk" "dist/$new_name"
          done
        env:
          FATTO_KEYSTORE_BASE64: ${{ secrets.FATTO_KEYSTORE_BASE64 }}
          FATTO_KEYSTORE_PASSWORD: ${{ secrets.FATTO_KEYSTORE_PASSWORD }}
          FATTO_KEY_ALIAS: ${{ secrets.FATTO_KEY_ALIAS }}

      - name: Rename APKs with fdroid suffix
        run: |
          mkdir -p dist-fdroid
          for apk in dist/*.apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "dist-fdroid/${base}-fdroid.apk"
          done

      - name: Upload APK Artifact (fdroid)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-apks-fdroid
          path: dist-fdroid/*.apk

      - name: Attach APK to Release (fdroid)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist-fdroid/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
