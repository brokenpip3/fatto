name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  generate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Setup Cachix
        if: github.repository == 'brokenpip3/fatto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: brokenpip3
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Cache Rust (fork fallback)
        if: github.repository != 'brokenpip3/fatto' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/taskchampion-android/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-fatto-ci-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('rust/taskchampion-android/Cargo.toml', 'rust/taskchampion-android/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-fatto-ci-${{ hashFiles('flake.nix', 'flake.lock') }}-
      - name: Generate UniFFI bindings with Nix
        if: github.repository == 'brokenpip3/fatto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          nix build .#taskchampion-android --no-update-lock-file
          rm -rf android/app/src/main/uniffi
          cp -R result/uniffi android/app/src/main/uniffi
      - name: Generate UniFFI bindings with Cargo (fork fallback)
        if: github.repository != 'brokenpip3/fatto' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: nix develop .#fatto-ci --no-update-lock-file --command just build-bindings
      - name: Upload uniffi bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uniffi-bindings
          path: android/app/src/main/uniffi/
          retention-days: 1

  ci:
    runs-on: ubuntu-latest
    needs: generate-bindings
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: check-lint-rust
            shell: fatto-ci-rust
          - command: check-lint-kotlin
            shell: fatto-ci-kotlin
          - command: test-rust
            shell: fatto-ci-rust
          - command: test-kotlin
            shell: fatto-ci-kotlin
          - command: test-ci-rust
            shell: fatto-ci-rust
          - command: build-debug-only
            shell: fatto-ci-kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Setup Cachix
        if: github.repository == 'brokenpip3/fatto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: brokenpip3
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Download uniffi bindings
        if: contains(matrix.shell, 'kotlin')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uniffi-bindings
          path: android/app/src/main/uniffi/
      - name: Cache Rust
        if: contains(matrix.shell, 'rust')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            rust/taskchampion-android/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ matrix.shell }}-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('rust/taskchampion-android/Cargo.toml', 'rust/taskchampion-android/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ matrix.shell }}-${{ hashFiles('flake.nix', 'flake.lock') }}-
      - name: Cache Gradle
        if: contains(matrix.shell, 'kotlin')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper
          key: v4-${{ runner.os }}-gradle-${{ matrix.shell }}-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            v4-${{ runner.os }}-gradle-${{ matrix.shell }}-${{ hashFiles('flake.nix', 'flake.lock') }}-
      - name: Run ${{ matrix.command }}
        run: nix develop .#${{ matrix.shell }} --no-update-lock-file --command just ${{ matrix.command }}
