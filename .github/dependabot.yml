version: 2
updates:
  # Rust (Cargo) updates
  - package-ecosystem: "cargo"
    directory: "/rust/taskchampion-android"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Android/Kotlin (Gradle) updates
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      android-toolchain:
        patterns:
          - "com.android.tools.build:gradle"
          - "org.jetbrains.kotlin:kotlin-gradle-plugin"
          - "org.jetbrains.kotlin.plugin.compose"
          - "gradle-wrapper"
      android-test-tooling:
        patterns:
          - "androidx.test:*"
          - "androidx.test.ext:*"
          - "androidx.test.espresso:*"
          - "io.mockk:*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
          - "org.jlleitschuh.gradle.ktlint"
          - "io.gitlab.arturbosch.detekt"
      android-runtime:
        patterns:
          - "androidx.*"
          - "net.java.dev.jna:jna"
        exclude-patterns:
          - "androidx.test:*"
          - "androidx.test.ext:*"
          - "androidx.test.espresso:*"
    ignore:
      # The following dependencies require compileSdk 37
      - dependency-name: "androidx.glance:glance-appwidget"
        versions:
          - "1.3.0-alpha*"
          - "1.3.0-beta*"
          - "1.3.0-rc*"
      - dependency-name: "androidx.glance:glance-material3"
        versions:
          - "1.3.0-alpha*"
          - "1.3.0-beta*"
          - "1.3.0-rc*"
      - dependency-name: "androidx.core:core-ktx"
        versions:
          - "1.19.*"
      - dependency-name: "androidx.compose:compose-bom"
        versions:
          - ">=2026.08.00"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # Docker updates (for docker-compose.yml)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  # Nix flake updates
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
