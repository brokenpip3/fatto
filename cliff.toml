[changelog]
header = ""
body = """
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^Merge pull request", skip = true },
    { message = "^bump", skip = true },
    { message = "^Merge branch", skip = true },
    { body = ".*", group = "Other Changes" },
]
